services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: swayamvani
      MYSQL_DATABASE: swayamvani
      MYSQL_USER: swayamvani
      MYSQL_PASSWORD: swayamvani
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uswayamvani -pswayamvani --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin123
      DB_VENDOR: mysql
      DB_DSN: swayamvani:swayamvani@tcp(db:3306)/swayamvani?parseTime=true
      CUSTOMER_SESSION_SECRET: "changeme-session-secret"
      RAZORPAY_KEY_ID: ""
      RAZORPAY_KEY_SECRET: ""
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_CLIENT_IP_HEADER: ${RATE_LIMIT_CLIENT_IP_HEADER:-}
      RATE_LIMIT_ADMIN_LOGIN: ${RATE_LIMIT_ADMIN_LOGIN:-5/15m}
      RATE_LIMIT_CUSTOMER_LOGIN: ${RATE_LIMIT_CUSTOMER_LOGIN:-10/15m}
      RATE_LIMIT_CUSTOMER_REGISTER: ${RATE_LIMIT_CUSTOMER_REGISTER:-5/1h}
      RATE_LIMIT_PASSWORD_RESET: ${RATE_LIMIT_PASSWORD_RESET:-3/1h}
      RATE_LIMIT_PASSWORD_RESET_COMPLETE: ${RATE_LIMIT_PASSWORD_RESET_COMPLETE:-10/15m}
      RATE_LIMIT_PASSWORD_UPDATE: ${RATE_LIMIT_PASSWORD_UPDATE:-5/15m}
      RATE_LIMIT_CHECKOUT: ${RATE_LIMIT_CHECKOUT:-20/1m}
      RATE_LIMIT_RAZORPAY_ORDER: ${RATE_LIMIT_RAZORPAY_ORDER:-10/1m}
      RATE_LIMIT_COUPON_USE: ${RATE_LIMIT_COUPON_USE:-10/1m}
      RATE_LIMIT_INQUIRY: ${RATE_LIMIT_INQUIRY:-5/1h}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mysqldata:
